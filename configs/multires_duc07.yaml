# ==============================================================================
# TODO: DUC 2007 dataset is currently not present in the workspace.
# Place raw or extracted NIST data in `data/duc2007` or update `data_dir` below.
# See `data/README.md` for format instructions.
# ==============================================================================
task_type: multi_resolution
dataset_name: duc2007
data_dir: data/duc2007  # TODO: Point to your DUC 2007 data directory
output_dir: outputs
seed: 42

preprocessing:
  min_sentence_chars: 15
  min_sentence_words: 3
  lowercase: true
  remove_punctuation: true
  remove_stopwords: true
  use_stemming: true
  ngram_range: [1, 2]
  sublinear_tf: true
  max_vocab_size: null

similarity:
  metric: cosine
  keep_diagonal: false
  clip_negative: true
  use_sparse_threshold: 2000

objective:
  alpha: 0.20
  lambda_weight: 4.0
  beta: 0.50
  k_ratio: 0.10
  concave_func: sqrt
  multi_resolution_ratios: [0.30, 0.15, 0.05]
  multi_resolution_lambdas: [2.0, 1.5, 1.0]

optimizer:
  budget_type: words
  budget_limit: 250
  enforce_strict_budget: true
  modified_greedy_guarantee: false
  sort_order: document_order
  random_seed: 42
  mmr_lambda: 0.70

evaluation:
  metrics: [rouge1, rouge2, rougeL]
  bootstrap_samples: 1000
  confidence_level: 0.95
  seed: 42

